<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>My Mobility Journal</title>
<style>
  /* Reset & base */
  *, *::before, *::after {
    box-sizing: border-box;
  }
  html, body {
    margin: 0; padding: 0;
    background: #F5EFE6;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #594536;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    user-select: none;
    min-height: 100vh;
    line-height: 1.5;
  }
  a, button {
    cursor: pointer;
    font-family: inherit;
    border: none;
    background: none;
    color: inherit;
  }
  button:focus, input:focus, select:focus, textarea:focus {
    outline: 2px solid #A9B6A0;
    outline-offset: 2px;
  }
  h1, h2, h3, h4 {
    margin: 0 0 0.3em 0;
    font-family: 'Georgia', serif;
    color: #8B6F57;
  }
  h1 {
    font-size: 2rem;
    font-weight: 700;
  }
  h2 {
    font-size: 1.4rem;
    font-weight: 600;
    margin-top: 1em;
  }
  p {
    margin: 0.3em 0;
  }
  /* Scrollbar for Webkit */
  ::-webkit-scrollbar {
    width: 7px;
  }
  ::-webkit-scrollbar-track {
    background: #FFFCF7;
  }
  ::-webkit-scrollbar-thumb {
    background-color: #E8C3CC;
    border-radius: 10px;
  }

  /* Layout */
  #app {
    max-width: 900px;
    margin: 0 auto;
    padding: 0.8rem 1rem 3rem 1rem;
  }
  header {
    position: sticky;
    top: 0; left: 0; right: 0;
    background: #FFFCF7;
    border-bottom: 1px solid #E6D5C3;
    padding: 1rem 1rem 0.5rem 1rem;
    z-index: 1000;
    box-shadow: 0 2px 3px rgb(0 0 0 / 0.05);
  }
  header h1 {
    letter-spacing: 0.04em;
    font-weight: 700;
    color: #8B6F57;
  }
  header .subtitle {
    font-size: 1rem;
    font-style: italic;
    color: #A9B6A0;
    margin-bottom: 0.5em;
  }
  header .top-info {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.2rem;
    font-weight: 600;
    font-size: 0.9rem;
    color: #594536;
    align-items: center;
  }
  #navigationButtons {
    margin-top: 0.8em;
    display: flex;
    justify-content: center;
    gap: 1.5rem;
  }
  #navigationButtons button {
    background: #E8C3CC;
    color: #594536;
    padding: 0.5em 1em;
    font-weight: 600;
    border-radius: 12px;
    box-shadow: 1px 1px 4px rgb(139 111 87 / 0.4);
    transition: background-color 0.3s ease;
  }
  #navigationButtons button:hover, #navigationButtons button:focus {
    background: #F6E4E7;
  }

  /* Cards */
  section.card {
    background: #FFFCF7;
    border: 1px solid #E6D5C3;
    border-radius: 18px;
    box-shadow: 0 4px 7px rgb(182 157 126 / 0.2);
    margin-top: 2rem;
    padding: 1.4rem 1.8rem 1.8rem 1.8rem;
  }
  section.card.decorated {
    background-image:
      repeating-radial-gradient(circle at 5px 5px, #E6D5C3 0, #E6D5C3 2px, transparent 3px, transparent 7px),
      repeating-linear-gradient(90deg, #F5EFE6 0, #F5EFE6 10px, #E6D5C3 11px, #F5EFE6 12px);
  }

  /* Labels and checkboxes */
  label {
    display: flex;
    align-items: center;
    font-weight: 600;
    font-size: 1rem;
    gap: 0.6em;
    cursor: pointer;
    user-select: none;
  }
  input[type="checkbox"] {
    appearance: none;
    width: 1.3em;
    height: 1.3em;
    border-radius: 6px;
    border: 2px solid #8B6F57;
    background-color: #FFFCF7;
    position: relative;
    box-shadow: inset 0 0 4px #E6D5C3;
    transition: background-color 0.3s ease, border-color 0.3s ease;
  }
  input[type="checkbox"]:checked {
    background-color: #A9B6A0;
    border-color: #A9B6A0;
  }
  input[type="checkbox"]:checked::after {
    content: "✓";
    color: #FFFCF7;
    position: absolute;
    font-weight: 800;
    font-size: 1.1em;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -53%);
    user-select: none;
  }
  input[type="checkbox"]:focus-visible {
    outline: 2px solid #A9B6A0;
    outline-offset: 3px;
  }

  /* Buttons for chronos and controls */
  button.chrono-btn {
    display: inline-block;
    background: #E8C3CC;
    color: #594536;
    border-radius: 16px;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 0.3em 1em;
    margin-left: 0.8em;
    box-shadow: 0 1px 3px rgb(139 111 87 / 0.3);
    transition: background-color 0.3s ease;
  }
  button.chrono-btn:hover, button.chrono-btn:focus {
    background: #F6E4E7;
  }

  /* Flex wrappers */
  .flex-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.8rem 1.2rem;
  }
  .flex-wrap-gap {
    gap: 1rem 1.2rem;
    flex-wrap: wrap;
  }
  .space-between {
    justify-content: space-between;
  }
  .centered {
    justify-content: center;
  }

  /* Scroll horizontal on small */
  .scroll-x-container {
    overflow-x: auto;
  }

  /* Timers */
  .timer-display {
    font-family: 'Courier New', Courier, monospace;
    font-weight: 700;
    color: #8B6F57;
    font-size: 1.1rem;
    min-width: 80px;
  }

  /* Progress bar */
  .progress-container {
    width: 100%;
    height: 1.1rem;
    background: #E6D5C3;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: inset 0 0 6px rgb(139 111 87 / 0.15);
    margin-top: 0.3rem;
  }
  .progress-bar {
    height: 100%;
    background-color: #E8C3CC;
    width: 0%;
    border-radius: 12px 0 0 12px;
    transition: width 0.3s ease;
  }
  .progress-bar.complete {
    background-color: #A9B6A0;
  }

  /* Scroll within cards for mobiles */
  .scroll-section {
    max-height: 480px;
    overflow-y: auto;
    padding-right: 4px;
  }

  /* Calendar */
  #calendar {
    overflow-x: auto;
    padding: 0.5rem 0;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(53, 14px);
    gap: 3px 3px;
    user-select: none;
  }
  .calendar-weekday {
    color: #594536;
    font-size: 0.75rem;
    margin-bottom: 0.3rem;
    user-select: none;
  }
  .calendar-month-labels {
    display: flex;
    justify-content: space-between;
    margin-bottom: 0.6rem;
    font-weight: 600;
    font-size: 0.8rem;
    color: #8B6F57;
  }
  .calendar-day {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    background: #FFFCF7;
    border: 1px solid #E6D5C3;
    box-shadow: inset 0 0 5px rgb(139 111 87 / 0.1);
  }
  .calendar-day.incomplete {
    background: #FFFCF7;
    border-color: #F6E4E7;
    box-shadow: 0 0 6px 2px #F6E4E7;
  }
  .calendar-day.mobility {
    background: #E6D5C3;
    border-color: #A9B6A0;
  }
  .calendar-day.mobil+renf {
    background: #E8C3CC;
    border-color: #E8C3CC;
  }
  .calendar-day.rest {
    background: #F6E4E7;
    border-color: #F6E4E7;
  }
  .calendar-day.today {
    border: 2px solid #A9B6A0;
  }
  .calendar-day:hover, .calendar-day:focus {
    outline: 2px solid #8B6F57;
    outline-offset: 2px;
  }
  /* Legend */
  #legend {
    margin-top: 1rem;
    font-size: 0.85rem;
    color: #594536;
    user-select: none;
  }
  #legend div {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 0.3rem;
  }
  .legend-box {
    width: 18px;
    height: 18px;
    border-radius: 6px;
    border: 1px solid #E6D5C3;
  }
  .legend-mobility { background: #E6D5C3; border-color: #A9B6A0; }
  .legend-mobilrenf { background: #E8C3CC; border-color: #E8C3CC; }
  .legend-rest { background: #F6E4E7; border-color: #F6E4E7; }
  .legend-incomplete {
    background: #FFFCF7;
    border-color: #F6E4E7;
    box-shadow: 0 0 6px 2px #F6E4E7;
  }

  /* Modal */
  #modalOverlay {
    position: fixed;
    top:0; left:0; right:0; bottom:0;
    background: rgba(245,239,230,0.92);
    backdrop-filter: blur(4px);
    z-index: 1500;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 1rem;
  }
  #modalOverlay.active {
    display: flex;
  }
  #modalContent {
    background: #FFFCF7;
    padding: 2rem 2.5rem;
    border-radius: 20px;
    box-shadow: 0 10px 20px rgb(139 111 87 / 0.35);
    max-width: 600px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    line-height: 1.4;
    color: #594536;
  }
  #modalContent h3 {
    font-weight: 700;
    margin-bottom: 1rem;
    color: #8B6F57;
  }
  #modalCloseBtn {
    background: #E8C3CC;
    color: #594536;
    font-weight: 600;
    padding: 0.5em 1.2em;
    border-radius: 20px;
    margin-top: 1.2rem;
    display: block;
    margin-left: auto;
    box-shadow: 0 2px 6px rgb(139 111 87 / 0.3);
  }
  #modalCloseBtn:hover, #modalCloseBtn:focus {
    background: #F6E4E7;
  }

  /* Sections nav */
  #sectionNav {
    position: sticky;
    top: 6.4rem;
    background: #FFFCF7;
    border-bottom: 1px solid #E6D5C3;
    box-shadow: 0 1px 4px rgb(139 111 87 / 0.12);
    z-index: 1200;
    display: flex;
    justify-content: space-around;
    padding: 0.8rem 0;
  }
  #sectionNav button {
    font-weight: 600;
    font-size: 1rem;
    color: #594536;
    background: #FFFCF7;
    border-radius: 12px;
    padding: 0.45em 0.9em;
    transition: background-color 0.3s ease;
  }
  #sectionNav button.active {
    background: #E8C3CC;
    color: #594536;
    box-shadow: 1px 1px 5px rgb(139 111 87 / 0.5);
  }
  #sectionNav button:focus {
    outline-offset: 3px;
    outline: 2px solid #A9B6A0;
  }

  /* Responsive */
  @media (max-width: 600px) {
    header h1 {
      font-size: 1.7rem;
    }
    #navigationButtons {
      gap: 1rem;
      flex-wrap: wrap;
    }
    #sectionNav {
      flex-wrap: wrap;
      row-gap: 0.5rem;
    }
  }

  /* Smaller fonts for notes */
  .note {
    font-size: 0.85rem;
    color: #8B6F57;
    margin-top: 0.2rem;
    font-style: italic;
    user-select: none;
  }
  .small-text {
    font-size: 0.85rem;
    color: #8B6F57;
  }
  /* Buttons with icon */
  button.icon-btn {
    display: flex;
    align-items: center;
    gap: 0.3em;
    padding: 0.4em 0.9em;
    user-select: none;
  }
  button.icon-btn svg {
    fill: #594536;
    width: 15px;
    height: 15px;
  }
  button.icon-btn:focus {
    outline-offset: 3px;
    outline: 2px solid #A9B6A0;
  }

  /* Inputs for numeric */
  input[type=number], input[type=text] {
    border: 1px solid #E6D5C3;
    font-family: inherit;
    font-size: 1rem;
    border-radius: 10px;
    padding: 2px 8px;
    max-width: 70px;
    color: #594536;
    background: #FFFCF7;
  }
  input[type=number]:focus, input[type=text]:focus {
    border-color: #A9B6A0;
    outline: none;
  }

  /* Special Sunday Rest page style background */
  body.rest-day {
    background: #F6E4E7;
  }
  section.rest-intro {
    text-align: center;
    padding: 2rem 1rem 3rem 1rem;
    color: #594536;
  }
  svg.rest-illustration {
    stroke: #8B6F57;
    stroke-width: 1.6;
    fill: none;
    margin: 1rem auto 1rem;
    max-width: 150px;
    display: block;
    opacity: 0.48;
  }

</style>
</head>
<body>
<div id="app" role="main" aria-label="My Mobility Journal">

<header role="banner" aria-label="Entête du site">
  <h1 tabindex="0">My Mobility Journal</h1>
  <p class="subtitle" tabindex="0">Chaque jour, un pas vers l’équilibre et la force douce</p>
  <div class="top-info" aria-live="polite">
    <div><strong>Date :</strong> <span id="dateDisplay" aria-atomic="true"></span></div>
    <div><strong>Jour :</strong> <span id="weekdayDisplay"></span></div>
    <div><strong>Séance :</strong> <span id="sessionType"></span></div>
    <div><strong>Progression :</strong> <div class="progress-container" style="width: 100px; display: inline-block;"><div id="dayProgressBar" class="progress-bar" style="width: 0%;"></div></div></div>
    <div><strong>Exercices terminés :</strong> <span id="exercisesCompletedCount">0</span>/<span id="exercisesTotalCount">0</span></div>
    <div><strong>Jours validés cette semaine :</strong> <span id="validatedDaysCount">0</span>/7</div>
  </div>
  <div id="navigationButtons" role="navigation" aria-label="Navigation des jours">
    <button id="btnPrevDay" aria-label="Jour précédent" title="Jour précédent">〈</button>
    <button id="btnToday" aria-label="Aujourd’hui" title="Aujourd’hui">Aujourd’hui</button>
    <button id="btnNextDay" aria-label="Jour suivant" title="Jour suivant">〉</button>
  </div>
</header>

<nav id="sectionNav" role="navigation" aria-label="Navigation des sections principales">
  <button id="navDashboard" class="active" aria-controls="mainContent" aria-selected="true" role="tab" tabindex="0">Tableau de bord</button>
  <button id="navProgramme" aria-controls="mainContent" aria-selected="false" role="tab" tabindex="-1">Programme du jour</button>
  <button id="navCalendar" aria-controls="mainContent" aria-selected="false" role="tab" tabindex="-1">Calendrier annuel</button>
  <button id="navProgressions" aria-controls="mainContent" aria-selected="false" role="tab" tabindex="-1">Progressions</button>
  <button id="navStats" aria-controls="mainContent" aria-selected="false" role="tab" tabindex="-1">Statistiques</button>
</nav>

<main id="mainContent" role="tabpanel" aria-live="polite" aria-atomic="true" tabindex="0">
  <!-- Dynamic content here -->
</main>

<!-- Modal for Export/Import & Confirm -->
<div id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
  <div id="modalContent">
    <h3 id="modalTitle"></h3>
    <pre id="modalText" style="white-space: pre-wrap;word-break: break-word; max-height: 50vh; overflow-y: auto; font-family: monospace; background: #F5EFE6; padding: 0.8rem; border-radius: 10px;"></pre>
    <div id="modalInputContainer" style="display:none; margin-top:1rem;">
      <textarea id="modalTextarea" rows="8" style="width: 100%; border-radius: 12px; border:1px solid #E6D5C3; background:#FFFCF7; color:#594536; font-family: monospace; font-size: 0.9rem;" aria-label="Zone de texte pour importer les données JSON"></textarea>
    </div>
    <div style="margin-top: 1.2rem; text-align: right;">
      <button id="modalCloseBtn">Fermer</button>
    </div>
  </div>
</div>

</div>

<script>
(() => {
  // Strict mode
  'use strict';

  /* COLORS */
  const COLORS = {
    beige_creme: '#F5EFE6',
    ivoire: '#FFFCF7',
    beige_sable: '#E6D5C3',
    marron_bois: '#8B6F57',
    marron_fonce: '#594536',
    rose_poudre: '#E8C3CC',
    rose_pale: '#F6E4E7',
    vert_sauge: '#A9B6A0'
  };

  /* DATA IDENTIFIERS & KEYS */
  const STORAGE_KEY_DATA = 'MyMobilityJournalData';
  const STORAGE_KEY_PROGRESSION_POMPES = 'MyMobilityProgressionPompes';
  const STORAGE_KEY_PROGRESSION_PLANCHE = 'MyMobilityProgressionPlanche';
  const STORAGE_KEY_PROGRESSION_HANDSTAND = 'MyMobilityProgressionHandstand';
  const STORAGE_KEY_META = 'MyMobilityMeta';

  /* PROGRAM SCHEDULES */
  const WEEK_SCHEDULE = {
    1: 'mobility+strength', // Monday
    2: 'mobility',          // Tuesday
    3: 'mobility+strength', // Wednesday
    4: 'mobility',          // Thursday
    5: 'mobility+strength', // Friday
    6: 'mobility',          // Saturday
    0: 'rest'               // Sunday (0 in JS getDay)
  };
  const WEEK_DAYS_FR = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];

  /* Progression timelines and data definitions */

  // Helper: format date YYYY-MM-DD localized for timezone
  function formatDate(d) {
    if (!(d instanceof Date)) return '';
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    const day = d.getDate();
    return `${y.toString().padStart(4,'0')}-${m.toString().padStart(2,'0')}-${day.toString().padStart(2,'0')}`;
  }
  // Helper: parse YYYY-MM-DD string
  function parseDate(str) {
    if (!str || typeof str !== 'string') return null;
    const [y,m,d] = str.split('-').map(Number);
    if (isNaN(y) || isNaN(m) || isNaN(d)) return null;
    // Create date at local midnight
    return new Date(y,m-1,d);
  }
  // Helper: get day number 0=sunday..6=saturday UTC is avoided; local only.
  function getWeekDay(date) {
    return date.getDay();
  }
  // Get French day name capitalized
  function getWeekDayName(date) {
    return WEEK_DAYS_FR[getWeekDay(date)].charAt(0).toUpperCase() + WEEK_DAYS_FR[getWeekDay(date)].slice(1);
  }

  // Return ISO week number and year according to ISO-8601
  function getISOWeekNumber(d) {
    const date = new Date(d.getTime());
    date.setHours(0,0,0,0);
    // Thursday in current week decides the year.
    date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
    const week1 = new Date(date.getFullYear(),0,4);
    return {
      year: date.getFullYear(),
      week: 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7)
    };
  }

  // Is leap year
  function isLeapYear(year){
    return (year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0));
  }

  // Days in month
  function daysInMonth(year, month) {
    return [31,isLeapYear(year)?29:28,31,30,31,30,31,31,30,31,30,31][month];
  }

  /* DATA STORAGE & MANAGEMENT */

  // Main data object shape:
  // {
  //   "YYYY-MM-DD":{
  //     "exercises": { id: booleanChecked, ... },
  //     "seriesCompleted": {...},
  //     "restConfirmed": boolean,
  //     "customSettings": {...},
  //     "notes": string,
  //   },
  //   "YYYY-MM-DD-next":{
  //     ...
  //   },
  //   ...
  // }
  // Separately:
  // { pompes: {...}, planche: {...}, handstand: {...} }

  let data = {};
  let progressionPompes = {};
  let progressionPlanche = {};
  let progressionHandstand = {};
  let meta = { programStartDate: null };

  // Load all from localStorage
  function loadAllData(){
    try {
      const d = localStorage.getItem(STORAGE_KEY_DATA);
      data = d ? JSON.parse(d) : {};
    } catch(e) { console.warn("Erreur lecture données", e); data = {}; }

    try {
      const p = localStorage.getItem(STORAGE_KEY_PROGRESSION_POMPES);
      progressionPompes = p ? JSON.parse(p) : getDefaultPompesProgression();
    } catch(e) { progressionPompes = getDefaultPompesProgression(); }

    try {
      const p = localStorage.getItem(STORAGE_KEY_PROGRESSION_PLANCHE);
      progressionPlanche = p ? JSON.parse(p) : getDefaultPlancheProgression();
    } catch(e) { progressionPlanche = getDefaultPlancheProgression(); }

    try {
      const p = localStorage.getItem(STORAGE_KEY_PROGRESSION_HANDSTAND);
      progressionHandstand = p ? JSON.parse(p) : getDefaultHandstandProgression();
    } catch(e) { progressionHandstand = getDefaultHandstandProgression(); }

    try {
      const m = localStorage.getItem(STORAGE_KEY_META);
      meta = m ? JSON.parse(m) : {};
    } catch(e) { meta = {}; }
  }
  // Save all to localStorage
  function saveAllData(){
    try { localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify(data)); } catch {}
    try { localStorage.setItem(STORAGE_KEY_PROGRESSION_POMPES, JSON.stringify(progressionPompes)); } catch {}
    try { localStorage.setItem(STORAGE_KEY_PROGRESSION_PLANCHE, JSON.stringify(progressionPlanche)); } catch {}
    try { localStorage.setItem(STORAGE_KEY_PROGRESSION_HANDSTAND, JSON.stringify(progressionHandstand)); } catch {}
    try { localStorage.setItem(STORAGE_KEY_META, JSON.stringify(meta)); } catch {}
  }

  // Get data for single date string yyyy-mm-dd
  function getDayData(dateStr){
    return data[dateStr] || {exercises: {}, seriesCompleted: {}, restConfirmed: false, customSettings: {}, notes: ''};
  }
  // Save day data
  function setDayData(dateStr, dayData){
    data[dateStr] = dayData;
    saveAllData();
  }
  function clearAllData(){
    if(confirm("Voulez-vous vraiment réinitialiser TOUTES vos données ? Cette action est irréversible.")){
      data = {};
      progressionPompes = getDefaultPompesProgression();
      progressionPlanche = getDefaultPlancheProgression();
      progressionHandstand = getDefaultHandstandProgression();
      meta = {};
      saveAllData();
      alert("Données réinitialisées.");
      loadAndRenderDate(currentDate);
      renderAllSections();
    }
  }

  /* DATA EXPORT / IMPORT */

  function exportData(){
    const fullData = {
      data,
      progressionPompes,
      progressionPlanche,
      progressionHandstand,
      meta
    };
    return JSON.stringify(fullData, null, 2);
  }
  // Import, with validation

      // Simple keys check for progression and meta
      if(!obj.progressionPompes || !obj.progressionPlanche || !obj.progressionHandstand || !obj.meta){

      }
      // Overwrite current with imported
      data = obj.data;
      progressionPompes = obj.progressionPompes;
      progressionPlanche = obj.progressionPlanche;
      progressionHandstand = obj.progressionHandstand;
      meta = obj.meta;

  // Format time mm:ss
  function formatTimeMs(ms){
    if(ms<0) ms=0;
    const totalSeconds = Math.floor(ms/1000);
    const m = Math.floor(totalSeconds/60);
    const s = totalSeconds % 60;
    return m.toString().padStart(2,'0') + ':' + s.toString().padStart(2,'0');
  }

  /* PROGRESSION HELPERS */

  // Return how many weeks passed since start date
  function weeksSinceStart() {
    if(!meta.programStartDate) return 0;
    const start = parseDate(meta.programStartDate);
    if(!start) return 0;
    const now = getTodayDate();
    const diffDays = Math.floor((now.getTime() - start.getTime()) / (1000*60*60*24));
    return Math.floor(diffDays/7) + 1;
  }
  // Return how many months passed since start
  function monthsSinceStart() {
    if(!meta.programStartDate) return 0;
    const start = parseDate(meta.programStartDate);
    if(!start) return 0;
    const now = getTodayDate();
    let months = (now.getFullYear() - start.getFullYear())*12 + (now.getMonth() - start.getMonth());
    // If day of month now < start day, consider not full month
    if(now.getDate() < start.getDate()) months--;
    return months+1;
  }

  /* VALIDATION RULES FOR DAYS */

  // Check if all exercises completed for a given day according to its type
  // Data for the day is passed as dayData
  function validateDay(dateStr){
    const dayDate = parseDate(dateStr);
    if(!dayDate) return 'none';
    const dayType = dayTypeForDate(dayDate);
    const dayData = getDayData(dateStr);
    // For rest day
    if(dayType === 'rest'){
      return dayData.restConfirmed ? 'rest' : 'none';
    }
    // For mobility days (Tue, Thu, Sat)
    if(dayType === 'mobility'){
      // all warmup exercises must be checked
      for(const ex of EXERCISES_WARMUP){
        if(!dayData.exercises[ex.id]) return 'incomplete';
      }
      return 'mobility';
    }
    // For mobility+strength days (Mon, Wed, Fri)
    if(dayType === 'mobility+strength'){
      // Check warmup exercises:
      for(const ex of EXERCISES_WARMUP){
        if(!dayData.exercises[ex.id]) return 'incomplete';
      }
      // Must have pompes and gainage and handstand checked
      // Check pompes: series 0,1,2 completed
      if(!dayData.seriesCompleted['pompes-0'] || !dayData.seriesCompleted['pompes-1'] || !dayData.seriesCompleted['pompes-2']) return 'incomplete';
      // Check gainage: series 0,1,2 completed
      if(!dayData.seriesCompleted['gainage-0'] || !dayData.seriesCompleted['gainage-1'] || !dayData.seriesCompleted['gainage-2']) return 'incomplete';
      // Handstand exercises: all series for each exercise completed
      for(const ex of HANDSTAND_EXERCISES){
        for(let s=0; s<ex.series; s++){
          if(!dayData.seriesCompleted[`${ex.id}-${s}`]) return 'incomplete';
        }
      }
      return 'mobil+renf';
    }
    return 'none';
  }

  // Render header with date, day name, session type, progress and controls
  function renderHeader(){
    const dateDisplayEl = document.getElementById('dateDisplay');
    const weekdayEl = document.getElementById('weekdayDisplay');
    const sessionTypeEl = document.getElementById('sessionType');
    const progressBarEl = document.getElementById('dayProgressBar');
    const exercisesCompletedCountEl = document.getElementById('exercisesCompletedCount');
    const exercisesTotalCountEl = document.getElementById('exercisesTotalCount');
    const validatedDaysCountEl = document.getElementById('validatedDaysCount');

    if(!dateDisplayEl || !weekdayEl || !sessionTypeEl || !progressBarEl || !exercisesCompletedCountEl || !exercisesTotalCountEl || !validatedDaysCountEl) return;

    // Today's date
    dateDisplayEl.textContent = formatDateFR(currentDate);
    weekdayEl.textContent = getWeekDayName(currentDate);

    // Session type
    const sessionTypeRaw = dayTypeForDate(currentDate);
    let sessionTypeText = '';
    switch(sessionTypeRaw){
      case 'mobility+strength': sessionTypeText = 'Mobilité + Renforcement'; break;
      case 'mobility': sessionTypeText = 'Mobilité'; break;
      case 'rest': sessionTypeText = 'Repos'; break;
      default: sessionTypeText = 'Repos'; break;
    }
    sessionTypeEl.textContent = sessionTypeText;

    // Count exercises checked for today
    const dayData = getDayData(formatDate(currentDate));
    let totalExercises = 0;
    let completedExercises = 0;
    // Count exercises according to day type
    if(sessionTypeRaw === 'mobility+strength'){
      totalExercises = EXERCISES_WARMUP.length;
      completedExercises = EXERCISES_WARMUP.reduce((acc, ex)=> acc + (dayData.exercises && dayData.exercises[ex.id]?1:0),0);
      // Pompes + gainage series count
      const pompesCount = 3;
      const gainageCount = 3;
      totalExercises += pompesCount + gainageCount;
      completedExercises += pompesCount + gainageCount;
      for(let i=0; i<3; i++){
        if(!dayData.seriesCompleted[`pompes-${i}`]) completedExercises--;
        if(!dayData.seriesCompleted[`gainage-${i}`]) completedExercises--;
      }
      // Handstand total series count
      let handstandSeries = 0;
      let handstandCompleted =0;
      for(const ex of HANDSTAND_EXERCISES){
        handstandSeries += ex.series;
        for(let s=0; s<ex.series; s++){
          if(dayData.seriesCompleted[`${ex.id}-${s}`]) handstandCompleted++;
        }
      }
      totalExercises += handstandSeries;
      completedExercises += handstandCompleted;
    } else if(sessionTypeRaw === 'mobility'){
      totalExercises = EXERCISES_WARMUP.length;
      completedExercises = EXERCISES_WARMUP.reduce((acc, ex)=> acc + (dayData.exercises && dayData.exercises[ex.id]?1:0),0);
    } else if(sessionTypeRaw === 'rest'){
      totalExercises = 1;
      completedExercises = dayData.restConfirmed ? 1 : 0;
    }

    exercisesCompletedCountEl.textContent = completedExercises;
    exercisesTotalCountEl.textContent = totalExercises;

    // Progress bar: completed/total in %
    const percent = totalExercises === 0 ? 0 : Math.floor((completedExercises / totalExercises)*100);
    progressBarEl.style.width = percent + '%';
    if(percent===100) progressBarEl.classList.add('complete');
    else progressBarEl.classList.remove('complete');

    // Count valid days this week
    const validatedCount = countValidatedDaysCurrentWeek();
    validatedDaysCountEl.textContent = validatedCount;
  }

  // Count validated days this week (Lundi-Dimanche)
  function countValidatedDaysCurrentWeek() {
    if(!currentDate) return 0;
    let monday = incrementDate(currentDate, - (currentDate.getDay()===0 ? 6 : currentDate.getDay()-1));
    let count = 0;
    for(let i=0; i<7; i++){
      const day = incrementDate(monday, i);
      const dateStr = formatDate(day);
      const val = validateDay(dateStr);
      if(val === 'mobility' || val === 'mobil+renf' || val === 'rest') count++;
    }
    return count;
  }

    // Attach side effect on pause / resume / stop to update buttons

    // To simplify, keep track with these functions

    function onTimerStart(){
      updateButtonsControls({start:false,pause:true,resume:false,reset:true});
    }
    function onTimerPause(){
      updateButtonsControls({start:false,pause:false,resume:true,reset:true});
    }
    function onTimerResume(){
      updateButtonsControls({start:false,pause:true,resume:false,reset:true});
    }
    function onTimerStop(){
      updateButtonsControls({start:true,pause:false,resume:false,reset:false});
    }

    // Override timer function hooks (patch startTimer, pauseTimer, resumeTimer, stopTimer)
    // For this special timer only

    function wrappedStartTimer(id, duration, cb){
      startTimer(id, duration, cb);
      if(id===chronoId) onTimerStart();
    }
    function wrappedPauseTimer(id){
      pauseTimer(id);
      if(id===chronoId) onTimerPause();
    }
    function wrappedResumeTimer(id){
      resumeTimer(id);
      if(id===chronoId) onTimerResume();
    }
    function wrappedStopTimer(id){
      stopTimer(id);
      if(id===chronoId) onTimerStop();
    }
    // Replace with wrappers
    window.startTimer = wrappedStartTimer;
    window.pauseTimer = wrappedPauseTimer;
    window.resumeTimer = wrappedResumeTimer;
    window.stopTimer = wrappedStopTimer;

    return section;
  }

  /* Pompes sur genoux section (Monday, Wednesday, Friday) */

  // Get dynamic reps range for pompes depending on progression step and mastery
  function getPompesRepsRange(){
    const weeks = weeksSinceStart();
    // Get best step index matching weeks
    for(let i = POMPES_STEPS.length - 1; i>=0; i--){
      let step = POMPES_STEPS[i];
      if(step.weeks && weeks >= step.weeks[0] && weeks <= step.weeks[1]) return step.repsRange;
      if(step.months && monthsSinceStart() >= step.months) return step.repsRange;
    }
    return [5,8]; // default fallback
  }

  // Helper: render calendar grid for one year
  function renderCalendarForYear(year, container){
    // Remove old calendar grid if any
    const oldGrid = container.querySelector('.calendar-grid');
    if(oldGrid) oldGrid.remove();

    // Compute start date (Monday of week 1 ISO or 4 Jan first)
    // We'll build week by week for 53 weeks (max)

    // Get first Monday of ISO year (week starts Monday)
    function getFirstMondayOfISOYear(y){
      const jan4 = new Date(y,0,4);
      let day = jan4.getDay(); // 0 Sunday..6 Sat
      day = (day === 0) ? 7 : day; // Mon=1..Sun=7;
      const diff = 1 - day; // offset to Monday before or after 4th Jan
      return new Date(y,0,4 + diff);
    }

    const firstMonday = getFirstMondayOfISOYear(year);

    // Build container div grid
    const grid = document.createElement('div');
    grid.className = 'calendar-grid';
    grid.setAttribute('role', 'grid');
    grid.setAttribute('aria-rowcount', 7);
    grid.style.gridTemplateRows = 'repeat(7, 14px)';
    grid.style.gridTemplateColumns = 'repeat(53, 14px)';
    grid.style.gap = '3px';

    // Weekday labels on left side: Mon .. Sun, small font, vertical alignment
    // We'll add these as first column (but for simplicity we can add above or next to grid)

    // Build day squares for entire year days + empty leading and trailing squares for calendar alignment

    // Create a map from dateStr to validation state for the year
    const validationMap = {};
    for(let month=0; month<12; month++){
      const dim = daysInMonth(year,month);
      for(let day=1; day<=dim; day++){
        const dStr = `${year.toString().padStart(4,'0')}-${(month+1).toString().padStart(2,'0')}-${day.toString().padStart(2,'0')}`;
        validationMap[dStr] = validateDay(dStr);
      }
    }

    // Add empty cells for the days before 1 January to align calendar to monday start
    // Also days before firstMonday?

    // Build set of invalid dates to exclude (before 1 Jan of year or after 31 Dec)

    // Actually, alignment will reflect the calendar weeks from firstMonday for 53 weeks.

    // To allow click on days:
    function onClickCalendarDay(e){
      const dateStr = e.target.getAttribute('data-date');
      if(!dateStr) return;
      const d = parseDate(dateStr);
      if(!d) return;
      currentDate = d;
      currentSection = 'programme';
      renderAllSections();
    }

    // For each week and each day of week (Mon-Sun), create day squares
    for(let week=0; week<53; week++){
      for(let wd=1; wd<=7; wd++){
        // Calculate date for this cell:
        let dayDate = new Date(firstMonday.getTime());
        dayDate.setDate(firstMonday.getDate() + week*7 + wd - 1);
        const isInYear = dayDate.getFullYear() === year;

        const daySquare = document.createElement('button');
        daySquare.type = 'button';
        daySquare.className = 'calendar-day';
        daySquare.tabIndex = isInYear ? 0 : -1;
        daySquare.setAttribute('aria-label', isInYear ? `Jour ${formatDateFR(dayDate)}` : '');
        daySquare.setAttribute('data-date', isInYear ? formatDate(dayDate) : '');
        daySquare.style.borderRadius = '6px';
        daySquare.style.width = '14px';
        daySquare.style.height= '14px';
        daySquare.style.padding = '0';
        daySquare.style.border = 'none';
        daySquare.style.background = COLORS.ivoire;
        daySquare.style.border = `1px solid ${COLORS.beige_sable}`;
        daySquare.style.cursor = isInYear ? 'pointer' : 'default';

        if(!isInYear){
          daySquare.style.visibility = 'hidden';
        } else {
          const status = validationMap[formatDate(dayDate)] || 'none';
          daySquare.classList.remove('inactive','mobility','mobil+renf','rest','incomplete','today');
          if(status === 'mobility') daySquare.classList.add('mobility');
          else if(status === 'mobil+renf') daySquare.classList.add('mobil+renf');
          else if(status === 'rest') daySquare.classList.add('rest');
          else if(status === 'incomplete') daySquare.classList.add('incomplete');
          if(formatDate(getTodayDate()) === formatDate(dayDate)){
            daySquare.classList.add('today');
            daySquare.setAttribute('aria-current','date');
          }
          // When clicked, go to that date and open programme
          daySquare.addEventListener('click', onClickCalendarDay);
          // keyboard enter/space handled by button default
        }
        // Place day square
        daySquare.style.gridColumnStart = week+1;
        daySquare.style.gridRowStart = wd;
        grid.appendChild(daySquare);
      }
    }

    // Add weekday labels (Mon..Sun) on left
    const labelsContainer = document.createElement('div');
    labelsContainer.style.display = 'grid';
    labelsContainer.style.gridTemplateRows = 'repeat(7, 14px)';
    labelsContainer.style.gridRowGap = '3px';
    labelsContainer.style.marginRight = '6px';
    labelsContainer.style.fontSize = '9px';
    labelsContainer.style.color = COLORS.marron_bois;
    labelsContainer.style.userSelect = 'none';
    const dayNamesShort = ['L','M','M','J','V','S','D'];

    dayNamesShort.forEach((d,i) => {
      const dEl = document.createElement('div');
      dEl.textContent = d;
      dEl.style.textAlign = 'center';
      dEl.style.lineHeight = '12px';
      labelsContainer.appendChild(dEl);
    });

    const calendarWrapper = document.createElement('div');
    calendarWrapper.style.display = 'flex';
    calendarWrapper.appendChild(labelsContainer);
    calendarWrapper.appendChild(grid);

    // Month labels
    const monthsLabelContainer = document.createElement('div');
    monthsLabelContainer.className = 'calendar-month-labels';
    monthsLabelContainer.style.marginBottom = '0.3rem';

    // We want to place month names above first occurrences of month in calendar columns
    // Compute first week number for each month of the year using ISO weeks

    for(let m = 0; m<12; m++){
      const firstDayMonth = new Date(year,m,1);
      // Calculate week number (ISO) for first day of month
      let weekNumber = getISOWeekNumber(firstDayMonth).week;
      if(m===0 && weekNumber > 50) weekNumber = 1; // correct edge case for Jan first week starting in Dec previous year
      // place the month label at the grid column = weekNumber
      const monthName = firstDayMonth.toLocaleString('fr-FR', {month: 'short'});
      const monthSpan = document.createElement('div');
      monthSpan.textContent = monthName;
      monthSpan.style.gridColumnStart = weekNumber;
      monthSpan.style.gridColumnEnd = weekNumber + 5;
      monthSpan.style.color = COLORS.marron_bois;
      monthSpan.style.fontWeight = '600';
      monthsLabelContainer.appendChild(monthSpan);
    }

    container.innerHTML = '';
    container.appendChild(monthsLabelContainer);
    container.appendChild(calendarWrapper);

    // Show summary of days validated stats
    const stats = getCalendarYearStats(year);

    const statsDiv = document.createElement('div');
    statsDiv.style.marginTop = '1rem';
    statsDiv.style.fontSize = '0.9rem';
    statsDiv.style.color = COLORS.marron_fonce;
    statsDiv.innerHTML = `
      <strong>Année ${year}</strong> :
      <br>Jours validés : ${stats.totalValidated} / 365${isLeapYear(year)?'+1 (année bissextile)':''}
      <br>Mobilité uniquement : ${stats.mobilityCount}
      <br>Mobilité + renforcement : ${stats.mobilRenfCount}
      <br>Repos respectés : ${stats.restCount}
      <br>Séances incomplètes : ${stats.incompleteCount}
    `;
    container.appendChild(statsDiv);
  }

  // Compute yearly stats for calendar summary
  function getCalendarYearStats(year){
    const stats = {
      totalValidated: 0,
      mobilityCount: 0,
      mobilRenfCount: 0,
      restCount: 0,
      incompleteCount: 0,
    };
    for(let month=0; month<12; month++){
      const dim = daysInMonth(year, month);
      for(let d=1; d<=dim; d++){
        const dStr = `${year.toString().padStart(4,'0')}-${(month+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
        const val = validateDay(dStr);
        if(val === 'mobility'){
          stats.totalValidated++;
          stats.mobilityCount++;
        } else if(val === 'mobil+renf'){
          stats.totalValidated++;
          stats.mobilRenfCount++;
        } else if(val === 'rest'){
          stats.totalValidated++;
          stats.restCount++;
        } else if(val === 'incomplete'){
          stats.incompleteCount++;
        }
      }
    }
    return stats;
  }

  // Compute stats based on stored data
  function renderStatistics(){
    const mainContent = document.getElementById('mainContent');
    if(!mainContent) return;
    mainContent.innerHTML = '';

    const container = document.createElement('section');
    container.className = 'card';

    const title = document.createElement('h2');
    title.textContent = 'Statistiques et suivi';
    container.appendChild(title);

    // Time now
    const today = getTodayDate();

    // Helper to get calendar stats for current year
    const year = today.getFullYear();
    const allStats = getCalendarYearStats(year);

    // Stats for this week & this month
    // For week - count validated days this week (already have countValidatedDaysCurrentWeek)
    const validatedWeek = countValidatedDaysCurrentWeek();

    // For month - count validated days this month:
    const currentMonth = today.getMonth();
    let validatedMonth = 0;
    for(let d=1; d<=daysInMonth(year,currentMonth); d++){
      const dStr = `${year.toString().padStart(4,'0')}-${(currentMonth+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
      const val = validateDay(dStr);
      if(val === 'mobility' || val === 'mobil+renf' || val === 'rest') validatedMonth++;
    }

    // Total sessions validées
    const totalValidated = allStats.totalValidated;

    // Calculate rate of completion: total completed / (total days lapsed since program start)
    let rateCompletion = 0;
    if(meta.programStartDate){
      let start = parseDate(meta.programStartDate);
      if(start <= today){
        let countDays = 0;
        let countCompleted = 0;
        for(let d=start.getTime(); d <= today.getTime(); d += 86400000){
          const dDate = new Date(d);
          const dStr = formatDate(dDate);
          const val = validateDay(dStr);
          if(WEEK_SCHEDULE[dDate.getDay()] === 'rest'){
            // count rest days
            countDays++;
            if(val === 'rest') countCompleted++;
          } else {
            if(val === 'mobility' || val === 'mobil+renf'){
              countDays++;
              countCompleted++;
            } else if(val === 'incomplete'){
              countDays++;
            } else {
              countDays++;
            }
          }
        }
        rateCompletion = countDays ? ((countCompleted / countDays)*100).toFixed(1) : 0;
      }
    }

    // Last date trained (reverse iterate)
    let lastDateTrained = null;
    const programStart = meta.programStartDate ? parseDate(meta.programStartDate) : null;
    if(programStart){
      let dayIter = today;
      while(dayIter >= programStart){
        const dStr = formatDate(dayIter);
        const val = validateDay(dStr);
        if(val === 'mobility' || val === 'mobil+renf' || val === 'rest'){
          lastDateTrained = dStr;
          break;
        }
        dayIter = incrementDate(dayIter, -1);
      }
    }

    // Cards grid for stats
    const statsGrid = document.createElement('div');
    statsGrid.style.display = 'grid';
    statsGrid.style.gridTemplateColumns = 'repeat(auto-fit, minmax(200px,1fr))';
    statsGrid.style.gap = '1rem';

    function createStatCard(label, value){
      const card = document.createElement('div');
      card.style.backgroundColor = COLORS.ivoire;
      card.style.border = `1px solid ${COLORS.beige_sable}`;
      card.style.borderRadius = '14px';
      card.style.padding = '1rem';
      card.style.boxShadow = `0 3px 6px rgb(139 111 87 / 0.15)`;
      const labelEl = document.createElement('div');
      labelEl.textContent = label;
      labelEl.style.color = COLORS.marron_bois;
      labelEl.style.fontWeight = '600';
      labelEl.style.marginBottom = '0.4rem';
      const valueEl = document.createElement('div');
      valueEl.textContent = value;
      valueEl.style.fontSize = '1.3rem';
      valueEl.style.color = COLORS.marron_fonce;
      card.appendChild(labelEl);
      card.appendChild(valueEl);
      return card;
    }

    statsGrid.appendChild(createStatCard('Séances validées cette semaine', validatedWeek));
    statsGrid.appendChild(createStatCard('Séances validées ce mois-ci', validatedMonth));
    statsGrid.appendChild(createStatCard('Total des séances validées cette année', totalValidated));
    statsGrid.appendChild(createStatCard('Séances mobilité réussies', allStats.mobilityCount));
    statsGrid.appendChild(createStatCard('Séances renforcement réussies', allStats.mobilRenfCount));
    statsGrid.appendChild(createStatCard('Jours de repos respectés', allStats.restCount));
    statsGrid.appendChild(createStatCard('Taux de complétion global (%)', rateCompletion));
    statsGrid.appendChild(createStatCard('Dernière date d\'entraînement validée', lastDateTrained || 'Aucune'));

    container.appendChild(statsGrid);

    mainContent.appendChild(container);
  }

  /* 7. CHRONOMETRES FUNCTIONALITY */

  /*
    Timers object keys:
    timerId: {
      intervalId,
      running,
      startTs,
      remainingMs,
      endTs,
      isCountdown,
      callback,
      pausedAt,
    }
  */

  // Start timer with id and durationMs and a callback rem, ended
  function startTimer(timerId, durationMs, callback){
    if(!timers) timers = {};
    stopTimer(timerId);
    const now = Date.now();
    timers[timerId] = {
      running: true,
      startTs: now,
      remainingMs: durationMs,
      endTs: now + durationMs,
      isCountdown: true,
      callback,
      pausedAt: null,
      intervalId: null
    };
    // Immediate call
    timers[timerId].callback(durationMs, false);

    timers[timerId].intervalId = setInterval(() => {
      const t = timers[timerId];
      if(!t || !t.running) return;
      const now = Date.now();
      t.remainingMs = t.endTs - now;
      if(t.remainingMs <= 0){
        t.remainingMs = 0;
        stopTimer(timerId);
        if(t.callback) t.callback(0, true);
      } else {
        if(t.callback) t.callback(t.remainingMs, false);
      }
    }, 250);
  }
  function pauseTimer(timerId){
    const t = timers[timerId];
    if(!t) return;
    if(!t.running) return;
    t.pausedAt = Date.now();
    t.remainingMs = t.endTs - t.pausedAt;
    clearInterval(t.intervalId);
    t.running = false;
  }
  function resumeTimer(timerId){
    const t = timers[timerId];
    if(!t) return;
    if(t.running) return;
    const now = Date.now();
    t.startTs = now;
    t.endTs = now + t.remainingMs;
    t.pausedAt = null;
    t.running = true;
    t.intervalId = setInterval(() => {
      const now = Date.now();
      t.remainingMs = t.endTs - now;
      if(t.remainingMs <= 0){
        t.remainingMs = 0;
        stopTimer(timerId);
        if(t.callback) t.callback(0, true);
      } else {
        if(t.callback) t.callback(t.remainingMs, false);
      }
    }, 250);
  }
  // Stop and clear timer
  function stopTimer(timerId){
    const t = timers[timerId];
    if(t && t.intervalId){
      clearInterval(t.intervalId);
      timers[timerId] = null;
    }
  }

  /* 8. NAVIGATION BUTTONS & USER INTERACTIONS */

  function setupNavigation(){
    // Prev day
    const btnPrev = document.getElementById('btnPrevDay');
    btnPrev.addEventListener('click', () => {
      currentDate = incrementDate(currentDate, -1);
      loadAndRenderDate(currentDate);
      renderAllSections();
    });
    // Next day
    const btnNext = document.getElementById('btnNextDay');
    btnNext.addEventListener('click', () => {
      // Do not go beyond today
      if(currentDate < getTodayDate()){
        currentDate = incrementDate(currentDate, 1);
        loadAndRenderDate(currentDate);
        renderAllSections();
      }
    });
    // Today
    const btnToday = document.getElementById('btnToday');
    btnToday.addEventListener('click', () => {
      currentDate = getTodayDate();
      loadAndRenderDate(currentDate);
      renderAllSections();
    });
  }

  // Navigation tabs
  function setupSectionNavigation(){
    const ids = ['Dashboard','Programme','Calendar','Progressions','Stats'];
    ids.forEach(id => {
      const btn = document.getElementById(`nav${id}`);
      if(!btn) return;
      btn.addEventListener('click', () => {
        currentSection = id.toLowerCase();
        if(currentSection === 'programme'){
          loadAndRenderDate(currentDate);
        }
        renderAllSections();
      });
    });
  }
  /* 9. LOAD & RENDER DATE'S DATA */

  // Load data and set header and UI for date
  function loadAndRenderDate(date){
    renderHeader();
    renderAllSections();
  }

  /* MODAL for export/import */

  function openModal(title, content, showTextarea=false){
    const overlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');
    const modalTextareaContainer = document.getElementById('modalInputContainer');
    const modalTextarea = document.getElementById('modalTextarea');
    if(!overlay || !modalTitle || !modalText || !modalTextareaContainer || !modalTextarea) return;

    modalTitle.textContent = title;
    modalText.textContent = showTextarea ? '' : content;
    modalText.style.display = showTextarea ? 'none' : 'block';
    modalTextareaContainer.style.display = showTextarea ? 'block' : 'none';

    if(showTextarea) modalTextarea.value = '';

    overlay.classList.add('active');
    overlay.focus();
  }
  function closeModal(){
    const overlay = document.getElementById('modalOverlay');
    overlay.classList.remove('active');
  }

  // Modal close button
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

  /* EXPORT / IMPORT HANDLERS */

  function setupExportImportButtons(){
    // Add buttons at bottom of dashboard section (or mobile nav)

    const mainContent = document.getElementById('mainContent');
    if(!mainContent) return;

    // Create container buttons
    const divBtns = document.createElement('div');
    divBtns.style.marginTop = '2rem';
    divBtns.style.display = 'flex';
    divBtns.style.justifyContent = 'center';
    divBtns.style.gap = '1rem';

    // Export button
    const btnExport = document.createElement('button');
    btnExport.textContent = 'Exporter mes données JSON';
    btnExport.className = 'chrono-btn';
    btnExport.addEventListener('click', () => {
      const jsonStr = exportData();
      openModal('Export des données JSON', jsonStr, false);
    });

    // Import button
    const btnImport = document.createElement('button');
    btnImport.textContent = 'Importer des données JSON';
    btnImport.className = 'chrono-btn';
    btnImport.addEventListener('click', () => {
      openModal('Importer des données JSON', '', true);
      // Setup textarea submit on modal Close
      const modalTextarea = document.getElementById('modalTextarea');
      modalTextarea.focus();
      modalTextarea.parentElement.querySelector('textarea').focus();
    });

    // Reset button
    const btnReset = document.createElement('button');
    btnReset.textContent = 'Réinitialiser mes données';
    btnReset.className = 'chrono-btn';
    btnReset.addEventListener('click', () => {
      clearAllData();
    });

    divBtns.appendChild(btnExport);
    divBtns.appendChild(btnImport);
    divBtns.appendChild(btnReset);

    mainContent.appendChild(divBtns);
  }

  // After modal open for import, setup event on textarea confirm on Enter + Ctrl
  document.getElementById('modalTextarea').addEventListener('keydown', (e) => {
    if(e.ctrlKey && e.key.toLowerCase() === 'enter'){
      e.preventDefault();
      const val = e.target.value.trim();
      if(val){
        importData(val);
      } else {
        alert('Veuillez coller vos données JSON dans la zone de texte.');
      }
    }
  });

  function init(){
    loadAllData();
    currentDate = getTodayDate();
    // If no programStartDate, set to today
    if(!meta.programStartDate){
      meta.programStartDate = formatDate(currentDate);
      saveAllData();
    }

    renderAllSections();
    renderHeader();
    setupNavigation();
    setupSectionNavigation();
    setupExportImportButtons();

    // Accessibility focus trap or fallbacks can be added here

    // Inform localStorage note
    const footerNote = document.createElement('p');
    footerNote.textContent = "Les données sont sauvegardées localement dans ce navigateur. Elles ne sont pas synchronisées automatiquement entre appareils.";
    footerNote.style.fontSize = '0.8rem';
    footerNote.style.marginTop = '2rem';
    footerNote.style.textAlign = 'center';
    footerNote.style.color = COLORS.marron_fonce;
    footerNote.style.userSelect = 'none';

    const app = document.getElementById('app');
    app.appendChild(footerNote);
  }

  // Run on DOM ready
  document.addEventListener('DOMContentLoaded', init);

})();
